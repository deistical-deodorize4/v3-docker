services:

  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    container_name: filebrowser
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.25
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8080:80"
    volumes:
      - ./files:/srv
      - ./filebrowser:/database
      - ${HUB_DATA_DIR:-/home/pi/pi02w-hub/data}:/srv/pi02w-hub:ro
    environment:
      FB_BASEURL: "/"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: "${WG_ADMIN_USERNAME:-admin}"
      INIT_PASSWORD: "${WG_ADMIN_PASSWORD:-}"
    env_file: .env
    volumes:
      - ./wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      # Override iptables with nftables wrapper (Pi OS Trixie has no ip_tables)
      - ./iptables-nft-wrapper.sh:/usr/sbin/iptables:ro
      - ./iptables-nft-wrapper.sh:/usr/sbin/iptables-restore:ro
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "127.0.0.1:${WG_UI_PORT:-51822}:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - homelab

  meshmonitor-ble-bridge:
    image: ghcr.io/yeraze/meshtastic-ble-bridge:2.0.0
    container_name: meshmonitor-ble-bridge
    privileged: true
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/lib/bluetooth:/var/lib/bluetooth:ro
    environment:
      - BLE_ADDRESS=${BLE_ADDRESS:-}
    command: ${BLE_ADDRESS:-}
    networks:
      - homelab

  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:2.8.2
    container_name: meshmonitor
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - meshmonitor-ble-bridge
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "8081:3001"
    volumes:
      - meshmonitor-data:/data
    env_file: .env
    environment:
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:8081
      - MESHTASTIC_NODE_IP=meshmonitor-ble-bridge
      - MESHTASTIC_NODE_PORT=4403
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    environment:
      TZ: "${TZ:-UTC}"
      WATCHTOWER_SCHEDULE: "0 0 7 1 * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SELF_UPDATE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - homelab

volumes:
  meshmonitor-data:
    driver: local

networks:
  homelab:
