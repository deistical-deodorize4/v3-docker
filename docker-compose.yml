services:

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.25
    ports:
      - "8080:80"
    volumes:
      - ./files:/srv
      - ./filebrowser:/database
    environment:
      FB_BASEURL: "/"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
    env_file: .env
    volumes:
      - ./wg-easy:/etc/wireguard
      - /lib/modules:/lib/modules:ro
      # Override iptables with nftables wrapper (Pi OS Trixie has no ip_tables)
      - ./iptables-nft-wrapper.sh:/usr/sbin/iptables:ro
      - ./iptables-nft-wrapper.sh:/usr/sbin/iptables-restore:ro
    ports:
      - "${WG_PORT:-51820}:51820/udp"
      - "127.0.0.1:${WG_UI_PORT:-51821}:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    networks:
      - homelab

  meshmonitor-ble-bridge:
    image: ghcr.io/yeraze/meshtastic-ble-bridge:latest
    container_name: meshmonitor-ble-bridge
    privileged: true
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.1
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/lib/bluetooth:/var/lib/bluetooth:ro
    environment:
      - BLE_ADDRESS=${BLE_ADDRESS:-}
    command: ${BLE_ADDRESS:-}
    networks:
      - homelab

  meshmonitor:
    image: ghcr.io/yeraze/meshmonitor:latest
    container_name: meshmonitor
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      - meshmonitor-ble-bridge
    ports:
      - "8081:3001"
    volumes:
      - meshmonitor-data:/data
    env_file: .env
    environment:
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:8081
      - MESHTASTIC_NODE_IP=meshmonitor-ble-bridge
      - MESHTASTIC_NODE_PORT=4403
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - homelab

volumes:
  meshmonitor-data:
    driver: local

networks:
  homelab:
