# Unbound config for Pi Zero 2W (native install)
# Installed to /etc/unbound/unbound.conf by install-hybrid.sh
# Listens on 127.0.0.1:5335 — Pi-hole points here
#
# PRIVACY NOTE:
# This config uses Cloudflare DoT (1.1.1.2/1.0.0.2) as forwarders —
# encrypted DNS via TLS, malware-blocking variants. This is the
# recommended balance for 512MB RAM: fast, private, secure.
#
# For MAXIMUM privacy (zero third-party DNS), comment out the
# forward-zone section below and uncomment these lines under server:
#     root-hints: /var/lib/unbound/root.hints
# Then download root hints: sudo wget -O /var/lib/unbound/root.hints \
#   https://www.internic.net/domain/named.root
# WARNING: Full recursion uses ~50-80MB more RAM. Monitor with 'free -h'.

server:
    verbosity: 1
    # Log to stderr instead of syslog (needed for Docker container logging)
    use-syslog: no
    logfile: ""
    # Listen on all interfaces (for Docker container port mapping)
    # Port map on the host side restricts access to 127.0.0.1 only
    interface: 0.0.0.0
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow

    # Explicit CA bundle path (needed for Cloudflare DoT)
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    # Privacy
    hide-identity: yes
    hide-version: yes

    # DNSSEC
    auto-trust-anchor-file: /var/lib/unbound/root.key
    val-clean-additional: yes
    val-log-level: 0

    # Resources (Pi Zero 2W — 512MB RAM, tuned for low memory)
    num-threads: 1
    rrset-cache-size: 32m
    msg-cache-size: 16m
    infra-cache-numhosts: 10000
    key-cache-size: 4m
    so-rcvbuf: 512k
    so-sndbuf: 512k

    # Prefetch — refresh cache before expiry
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-reply-ttl: 30

    # Timeouts
    infra-host-ttl: 900
    infra-cache-min-rtt: 200
    infra-keep-probing: yes
    fast-server-num: 3
    jostle-timeout: 200
    tcp-idle-timeout: 300

    # Connections
    outgoing-range: 64
    outgoing-num-tcp: 8
    num-queries-per-thread: 32

# Forward to Quad9 DoT (malware blocking, Swiss non-profit, audited privacy)
forward-zone:
    name: "."
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-tls-upstream: yes
